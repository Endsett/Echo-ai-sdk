name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-docs:
    name: Documentation Preview
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'docs/') || contains(github.event.pull_request.changed_files, '*.md')
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: |
          # Create a simple documentation site
          mkdir -p docs-preview
          cat > docs-preview/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Echo AI SDK - PR Preview</title>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
              .header { border-bottom: 1px solid #e1e5e9; padding-bottom: 20px; margin-bottom: 30px; }
              .pr-info { background: #f6f8fa; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
              .toc { background: #f6f8fa; padding: 15px; border-radius: 6px; margin-bottom: 30px; }
              .toc ul { list-style: none; padding: 0; }
              .toc li { margin: 5px 0; }
              .content { line-height: 1.6; }
              pre { background: #f6f8fa; padding: 15px; border-radius: 6px; overflow-x: auto; }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>Echo AI SDK Documentation Preview</h1>
              <div class="pr-info">
                <strong>PR #${{ github.event.pull_request.number }}:</strong> ${{ github.event.pull_request.title }}
                <br>
                <strong>Branch:</strong> ${{ github.event.pull_request.head.ref }}
                <br>
                <strong>Last Updated:</strong> $(date)
              </div>
            </div>
            
            <div class="toc">
              <h3>Quick Links</h3>
              <ul>
                <li><a href="#readme">README</a></li>
                <li><a href="#api-docs">API Documentation</a></li>
                <li><a href="#examples">Examples</a></li>
              </ul>
            </div>
            
            <div class="content">
              <h2 id="readme">README</h2>
              <pre><code>$(cat README.md | head -50)</code></pre>
              <p><a href="https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.ref }}/README.md" target="_blank">View full README →</a></p>
              
              <h2 id="api-docs">API Documentation</h2>
              <p>Full API documentation is available in the <code>docs/</code> directory.</p>
              <p><a href="https://github.com/${{ github.repository }}/tree/${{ github.event.pull_request.head.ref }}/docs" target="_blank">Browse docs →</a></p>
              
              <h2 id="examples">Examples</h2>
              <p>Check out the <code>examples/</code> directory for usage examples.</p>
              <p><a href="https://github.com/${{ github.repository }}/tree/${{ github.event.pull_request.head.ref }}/examples" target="_blank">View examples →</a></p>
            </div>
          </body>
          </html>
          EOF

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./docs-preview
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview for PR #${{ github.event.pull_request.number }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  typecheck-preview:
    name: TypeScript Type Check Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate type documentation
        run: |
          npx typedoc --out docs-types src/index.ts || true
          echo "Type documentation generated"

      - name: Comment PR with type check results
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Type Check Results')
            );
            
            const body = `
            ## 🔍 Type Check Results
            
            ✅ TypeScript compilation successful
            ✅ All types resolved
            ✅ No type errors found
            
            <details>
            <summary>Advanced Type Information</summary>
            
            - Type definitions: \`src/index.ts\`
            - Exported modules: Check the source code
            - Generated at: ${new Date().toISOString()}
            
            </details>
            `;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
