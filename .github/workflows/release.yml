name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release.outputs.version }}
      release-published: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Build bundles
        run: npm run build

      - name: Get pre-release version
        id: pre
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check release result
        id: release
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          if [ "$NEW_VERSION" != "${{ steps.pre.outputs.version }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  create-release-artifacts:
    name: Create Release Artifacts
    needs: release
    if: needs.release.outputs.release-published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Create release archive
        run: |
          mkdir -p release-artifacts
          tar -czf release-artifacts/echo-ai-sdk-ts-${{ needs.release.outputs.release-version }}.tgz dist/
          cp README.md LICENSE release-artifacts/
          cp -r docs release-artifacts/ || true

      - name: Upload release artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const releaseVersion = '${{ needs.release.outputs.release-version }}';
            const assetPath = `./release-artifacts/echo-ai-sdk-ts-${releaseVersion}.tgz`;
            const assetName = `echo-ai-sdk-ts-${releaseVersion}.tgz`;
            
            // Get the latest release
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            
            if (releases.length > 0) {
              const release = releases[0];
              
              // Upload the asset
              const fileData = fs.readFileSync(assetPath);
              
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: assetName,
                data: fileData,
              });
              
              console.log(`Uploaded ${assetName} to release ${release.tag_name}`);
            }
