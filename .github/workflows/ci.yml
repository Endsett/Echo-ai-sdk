name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript compilation check
        run: npx tsc --noEmit || true
        # Allow non-zero exit for pre-existing errors in non-memory modules.
        # Once all modules are clean, change to strict: `run: npx tsc --noEmit`

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
        name: Check Source Formatting (ESLint)
      - run: npm run lint:types
        name: Check TypeScript Compilability
      - run: npx vitest run --coverage
        name: Test & Enforce Coverage Baseline
      
      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            vitest_report.json
            test_report.json
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build CJS + ESM bundles
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js || (echo "❌ CJS bundle missing" && exit 1)
          test -f dist/index.mjs || (echo "❌ ESM bundle missing" && exit 1)
          echo "✅ CJS: $(wc -c < dist/index.js) bytes"
          echo "✅ ESM: $(wc -c < dist/index.mjs) bytes"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
